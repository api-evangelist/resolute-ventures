name: Resolute Ventures
description: 'Resolute Ventures is an early-stage venture capital firm that typically
  writes a founder''s first VC check, backing pre-seed and seed-stage companies. Co-founded
  by Mike Hirshland and Raanan Bar-Cohen, the firm invests in people rather than ideas,
  backing mission-driven founders with the grit, energy and conviction to bring their
  ideas to life and offering community, mentorship, health & wellness, and team-building
  support. Portfolio companies include Vercel, Opendoor, Greenhouse, Hello Heart and
  Signifyd. Added to the API Evangelist network as a portfolio company of Foundry Group.'
